# Rule inserted into /etc/cloudflared/config.yml on ubox0, ABOVE the catch-all http_status:404.
  - hostname: creekwatch.realm.watch
    service: https://localhost:443
    originRequest:
      originServerName: creekwatch.realm.watch
  - hostname: creek.realm.watch          # short alias: Caddy answers with a 301 to creekwatch.realm.watch
    service: https://localhost:443
    originRequest:
      originServerName: creek.realm.watch
