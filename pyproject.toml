[project]
name = "creek-watch"
version = "0.1.0"
description = "Citizen creek reports + public data -> explainable creek-health score (Wolf Creek & Deer Creek)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "httpx>=0.27",
    "sigil.realm.watch @ git+https://github.com/jphein/sigil.realm.watch#subdirectory=python",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# backend/ holds the `creekwatch` package; repo root holds the data lane's `data` package.
pythonpath = ["backend", "."]
testpaths = ["backend/tests", "data"]

[tool.uv]
package = false
